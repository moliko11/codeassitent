# 供应商默认 + 每个 provider 的非密钥参数。
# api_key 只从 api_key_env 指定的环境变量读(code/.env),绝不放 YAML。
# base_url/model 为空 -> 回退读 ${env_prefix}_BASE_URL / _MODEL(保持 .env 可用)。
default: openai_compatible    # 主入口(REPL/chatweb)默认 provider; AGENT_PROVIDER env 可覆盖
providers:
  openai_compatible:
    env_prefix: DEEPSEEK
    api_key_env: DEEPSEEK_API_KEY
    base_url: ""
    model: ""
  ark:
    env_prefix: VOLCANO_ENGINE
    api_key_env: VOLCANO_ENGINE_API_KEY
    base_url: ""
    model: ""
